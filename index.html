<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>語音翻譯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f4f8;padding:16px;min-height:100vh}
.section{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h2{margin:0 0 12px;color:#1a202c;font-size:18px;text-align:center;font-weight:600}
.lang{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.lang button{padding:10px 14px;border:2px solid #3182ce;background:white;color:#3182ce;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;min-width:70px;touch-action:manipulation}
.lang button.active{background:#3182ce;color:white}
.text{min-height:80px;padding:14px;background:#f7fafc;border-radius:8px;font-size:16px;line-height:1.6;color:#1a202c;margin-bottom:12px;word-break:break-word}
.btn{width:100%;max-width:160px;height:160px;border-radius:50%;border:none;cursor:pointer;font-size:20px;font-weight:bold;color:white;margin:0 auto;display:block;touch-action:manipulation;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:all 0.2s}
.btn-blue{background:#3182ce}
.btn-blue.active{background:#e53e3e;box-shadow:0 0 0 10px rgba(229,62,62,0.25);transform:scale(1.05)}
.btn-red{background:#e53e3e}
.btn-red.active{background:#3182ce;box-shadow:0 0 0 10px rgba(49,130,206,0.25);transform:scale(1.05)}
@media(max-width:480px){
  body{padding:12px}
  .section{padding:16px}
  h2{font-size:16px}
  .lang button{padding:8px 12px;font-size:13px;min-width:60px}
  .btn{width:140px;height:140px;font-size:18px}
  .text{font-size:15px}
}
</style>
</head>
<body>
<div class="section">
  <h2>🗣️ 去本的語言</h2>
  <div class="lang">
    <button onclick="setLang1('zh-TW')" class="active" id="lang1-zh">🇹🇼 中文</button>
    <button onclick="setLang1('en-US')" id="lang1-en">🇬🇧 EN</button>
    <button onclick="setLang1('ja-JP')" id="lang1-ja">🇯🇵 日本</button>
    <button onclick="setLang1('ko-KR')" id="lang1-ko">🇰🇷 한국</button>
  </div>
  <div class="text" id="text1">請按下方按鈕開始說話...</div>
  <button class="btn btn-blue" id="btn1" onclick="toggle1()">🎤 說話</button>
</div>

<div class="section">
  <h2>🌍 翻譯結果</h2>
  <div class="lang">
    <button onclick="setLang2('zh-TW')" id="lang2-zh">🇹🇼 中文</button>
    <button onclick="setLang2('en-US')" class="active" id="lang2-en">🇬🇧 EN</button>
    <button onclick="setLang2('ja-JP')" id="lang2-ja">🇯🇵 日本</button>
    <button onclick="setLang2('ko-KR')" id="lang2-ko">🇰🇷 한국</button>
  </div>
  <div class="text" id="text2">翻譯內容將顯示於此...</div>
  <button class="btn btn-red" id="btn2" onclick="toggle2()">🔄 翻譯</button>
</div>

<script>
let lang1='zh-TW',lang2='en-US',rec1,rec2,speaking1=false,speaking2=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)alert('不支援語音，請用 Chrome/Edge');

function setLang1(l){
lang1=l;
document.querySelectorAll('[id^=lang1-]').forEach(b=>b.classList.remove('active'));
document.getElementById('lang1-'+l.split('-')[0]).classList.add('active');
}

function setLang2(l){
lang2=l;
document.querySelectorAll('[id^=lang2-]').forEach(b=>b.classList.remove('active'));
document.getElementById('lang2-'+l.split('-')[0]).classList.add('active');
}

function toggle1(){
if(!speaking1){
speaking1=true;
document.getElementById('btn1').classList.add('active');
document.getElementById('btn1').innerHTML='🔴 錄音中';
rec1=new SR();
rec1.lang=lang1;
rec1.continuous=true;
rec1.interimResults=true;
let fullText='';
rec1.onresult=e=>{
let final='';
for(let i=e.resultIndex;i<e.results.length;i++){
if(e.results[i].isFinal)final+=e.results[i][0].transcript;
}
if(final){
fullText+=final;
document.getElementById('text1').textContent=fullText;
translate(fullText,lang1,lang2,'text2');
}
};
rec1.start();
}else{
speaking1=false;
rec1.stop();
document.getElementById('btn1').classList.remove('active');
document.getElementById('btn1').innerHTML='🎤 說話';
}
}

function toggle2(){
if(!speaking2){
speaking2=true;
document.getElementById('btn2').classList.add('active');
document.getElementById('btn2').innerHTML='🔴 錄音中';
rec2=new SR();
rec2.lang=lang2;
rec2.continuous=true;
rec2.interimResults=true;
let fullText='';
rec2.onresult=e=>{
let final='';
for(let i=e.resultIndex;i<e.results.length;i++){
if(e.results[i].isFinal)final+=e.results[i][0].transcript;
}
if(final){
fullText+=final;
document.getElementById('text2').textContent=fullText;
translate(fullText,lang2,lang1,'text1');
}
};
rec2.start();
}else{
speaking2=false;
rec2.stop();
document.getElementById('btn2').classList.remove('active');
document.getElementById('btn2').innerHTML='🔄 翻譯';
}
}

async function translate(text,from,to,targetId){
const fromCode=from.split('-')[0];
const toCode=to.split('-')[0];
try{
const res=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromCode}&tl=${toCode}&dt=t&q=${encodeURIComponent(text)}`);
const data=await res.json();
const translated=data[0].map(x=>x[0]).join('');
document.getElementById(targetId).textContent=translated;
speak(translated,to);
}catch(e){
console.error(e);
}
}

function speak(text,lang){
const u=new SpeechSynthesisUtterance(text);
u.lang=lang;
u.rate=0.9;
speechSynthesis.speak(u);
}
</script>
</body>
</html>
