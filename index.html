<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>語音翻譯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f4f8;padding:16px;min-height:100vh}
.tabs{display:flex;gap:10px;margin-bottom:20px;justify-content:center}
.tab{padding:12px 24px;border:2px solid #3182ce;background:white;color:#3182ce;border-radius:8px;cursor:pointer;font-weight:600;font-size:16px;min-width:100px;touch-action:manipulation}
.tab.active{background:#3182ce;color:white}
.section{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h2{margin:0 0 12px;color:#1a202c;font-size:18px;text-align:center;font-weight:600}
.lang{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.lang button{padding:10px 14px;border:2px solid #3182ce;background:white;color:#3182ce;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;min-width:70px;touch-action:manipulation}
.lang button.active{background:#3182ce;color:white}
.text{min-height:80px;padding:14px;background:#f7fafc;border-radius:8px;font-size:16px;line-height:1.6;color:#1a202c;margin-bottom:12px;word-wrap:break-word}
.btn{width:100%;max-width:160px;height:160px;border-radius:50%;border:none;cursor:pointer;font-size:20px;font-weight:bold;color:white;margin:0 auto;display:block;box-shadow:0 4px 16px rgba(0,0,0,0.2);touch-action:manipulation}
.btn-blue{background:#3182ce}
.btn-blue.active{background:#e53e3e;box-shadow:0 0 0 10px rgba(229,62,62,0.25);transform:scale(1.05)}
.btn-red{background:#e53e3e}
.btn-red.active{background:#3182ce;box-shadow:0 0 0 10px rgba(49,130,206,0.25);transform:scale(1.05)}
.download{width:100%;max-width:160px;height:50px;border-radius:8px;border:none;cursor:pointer;font-size:16px;font-weight:bold;color:white;background:#38a169;margin:10px auto;display:block;touch-action:manipulation}
@media(max-width:480px){
body{padding:12px}
.section{padding:16px}
h2{font-size:16px}
.lang button{padding:8px 12px;font-size:13px;min-width:60px}
.btn{width:140px;height:140px;font-size:18px}
.text{font-size:15px}
.download{width:100%;height:48px;font-size:16px}
}
</style>
</head>
<body>
<div class="tabs">
<button class="tab active" onclick="showMode('transcript')">📝 逐字稿</button>
<button class="tab" onclick="showMode('translate')">🌐 翻譯</button>
</div>

<div id="transcript-mode">
<div class="section">
<h2>📝 錄音逐字稿</h2>
<div class="text" id="text0">請按下方按鈕開始錄音...</div>
<button class="btn btn-blue" id="btn0" onclick="toggle0()">🎤 開始錄音</button>
</div>
<button class="download" onclick="downloadTranscript()">💾 下載逐字稿</button>
</div>

<div id="translate-mode" style="display:none">
<div class="section">
<h2>🗣️ 去本的語言</h2>
<div class="lang">
<button onclick="setLang1('zh-TW')" class="active" id="lang1-zh">🇹🇼 中文</button>
<button onclick="setLang1('en-US')" id="lang1-en">🇬🇧 EN</button>
<button onclick="setLang1('ja-JP')" id="lang1-ja">🇯🇵 日本</button>
<button onclick="setLang1('ko-KR')" id="lang1-ko">🇰🇷 한국</button>
</div>
<div class="text" id="text1">請按下方按鈕開始說話...</div>
<button class="btn btn-blue" id="btn1" onclick="toggle1()">🔇 說話</button>
</div>

<div class="section">
<h2>🌍 翻譯結果</h2>
<div class="lang">
<button onclick="setLang2('zh-TW')" id="lang2-zh">🇹🇼 中文</button>
<button onclick="setLang2('en-US')" class="active" id="lang2-en">🇬🇧 EN</button>
<button onclick="setLang2('ja-JP')" id="lang2-ja">🇯🇵 日本</button>
<button onclick="setLang2('ko-KR')" id="lang2-ko">🇰🇷 한국</button>
</div>
<div class="text" id="text2">翻譯內容將顯示於此...</div>
<button class="btn btn-red" id="btn2" onclick="toggle2()">🔄 翻譯</button>
</div>
</div>

<script>
let currentMode='transcript';
let lang1='zh-TW',lang2='en-US',rec0,rec1,speaking1=false,speaking2=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)alert('不支援語音辨識，請用 Chrome/Edge');

function showMode(mode){
currentMode=mode;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
event.target.classList.add('active');
if(mode==='transcript'){
document.getElementById('transcript-mode').style.display='block';
document.getElementById('translate-mode').style.display='none';
}else{
document.getElementById('transcript-mode').style.display='none';
document.getElementById('translate-mode').style.display='block';
}
}

function toggle0(){
if(speaking1){rec0.stop();speaking1=false;btn0.textContent='🎤 開始錄音';btn0.classList.remove('active');return}
speaking1=true;btn0.textContent='⏹️ 停止錄音';btn0.classList.add('active');
rec0=new SR();rec0.lang='zh-TW';rec0.continuous=true;rec0.interimResults=true;
rec0.onresult=e=>{let t=Array.from(e.results).map(r=>r[0].transcript).join('');text0.textContent=t};
rec0.onerror=e=>text0.textContent='錯誤:'+e.error;
rec0.onend=()=>{speaking1=false;btn0.textContent='🎤 開始錄音';btn0.classList.remove('active')};
rec0.start();
}

function downloadTranscript(){
const t=text0.textContent;
if(!t||t==='請按下方按鈕開始錄音...'){alert('沒有逐字稿內容');return}
const blob=new Blob([t],{type:'text/plain;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download='逐字稿_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.txt';
a.click();URL.revokeObjectURL(url);
}

function setLang1(l){lang1=l;document.querySelectorAll('[id^=lang1-]').forEach(b=>b.classList.remove('active'));document.getElementById('lang1-'+l.split('-')[0].toLowerCase()).classList.add('active')}
function setLang2(l){lang2=l;document.querySelectorAll('[id^=lang2-]').forEach(b=>b.classList.remove('active'));document.getElementById('lang2-'+l.split('-')[0].toLowerCase()).classList.add('active')}

function toggle1(){
if(speaking1){rec1.stop();speaking1=false;btn1.textContent='🔇 說話';btn1.classList.remove('active');return}
speaking1=true;btn1.textContent='⏺️ 錄音中';btn1.classList.add('active');
rec1=new SR();rec1.lang=lang1;rec1.continuous=true;rec1.interimResults=true;
rec1.onresult=e=>{let t=Array.from(e.results).map(r=>r[0].transcript).join('');text1.textContent=t};
rec1.onerror=e=>text1.textContent='錯誤:'+e.error;
rec1.onend=()=>{speaking1=false;btn1.textContent='🔇 說話';btn1.classList.remove('active')};
rec1.start();
}

async function toggle2(){
const txt=text1.textContent;
if(!txt||txt==='請按下方按鈕開始說話...'){alert('請先說話');return}
if(speaking2)return;
speaking2=true;btn2.textContent='⏳ 翻譯中...';btn2.classList.add('active');
try{
const from=lang1.split('-')[0],to=lang2.split('-')[0];
const res=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(txt)}`);
const json=await res.json();
const translated=json[0].map(x=>x[0]).join('');
text2.textContent=translated;
const u=new SpeechSynthesisUtterance(translated);u.lang=lang2;u.rate=0.9;speechSynthesis.speak(u);
u.onend=()=>{speaking2=false;btn2.textContent='🔄 翻譯';btn2.classList.remove('active')};
}catch(e){text2.textContent='翻譯失敗:'+e.message;speaking2=false;btn2.textContent='🔄 翻譯';btn2.classList.remove('active')}
}
</script>
</body>
</html>
